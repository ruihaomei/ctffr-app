[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctffr-app"
version = "0.1.0"
description = "Local-first research application for locked CT-FFR inference"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "LICENCE TBD"}
authors = [{name = "PLACEHOLDER"}]
dependencies = [
  "joblib==1.4.2",
  "matplotlib==3.10.5",
  "numpy==1.26.4",
  "openpyxl==3.1.5",
  "pandas==2.3.2",
  "scikit-learn==1.8.0",
  "shap==0.46.0",
  "streamlit==1.32.0",
  "xlrd==2.0.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.3", "pytest-cov==5.0.0"]

[project.scripts]
ctffr = "ctffr.cli:main"

[tool.setuptools]
packages = ["ctffr"]

[tool.setuptools.data-files]
artifacts = [
  "artifacts/golden_cases.json",
  "artifacts/locked_model.joblib",
  "artifacts/model_metadata.json",
  "artifacts/shap_background.npz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["ctffr"]

[tool.coverage.report]
fail_under = 90
show_missing = true
